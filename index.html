<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- VIEWPORT — prevents zoom, fits perfectly on iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- iOS PWA — makes it feel like a real native app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maniyara" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- THEME COLOR — matches your dark UI -->
    <meta name="theme-color" content="#070810" />

    <!-- APP ICONS — for iOS home screen bookmark -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- PWA MANIFEST -->
    <link rel="manifest" href="/manifest.json" />

    <title>Maniyara</title>

    <style>
      /* iOS — removes tap blue flash, 300ms delay fix, smooth scroll */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }

      html, body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        background-color: #070810;
        margin: 0;
        padding: 0;
        height: 100%;
        /* iPhone notch + home bar safe area */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      #root {
        height: 100%;
        background-color: #070810;
      }

      /* Instant splash screen while React loads */
      #splash {
        position: fixed;
        inset: 0;
        background: #070810;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }

      #splash-logo {
        width: 90px;
        height: 90px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(125,249,170,.2);
        animation: pulse 1.6s ease-in-out infinite;
      }
      #splash-logo img { width: 100%; height: 100%; object-fit: cover; }

      #splash-text {
        margin-top: 18px;
        font-family: Georgia, serif;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #7DF9AA;
        text-transform: uppercase;
      }
      #splash-sub {
        margin-top: 6px;
        font-size: 12px;
        color: #4a5070;
        letter-spacing: 2px;
      }

      @keyframes pulse {
        0%,100% { box-shadow: 0 0 20px rgba(125,249,170,.1); }
        50%      { box-shadow: 0 0 50px rgba(125,249,170,.4); }
      }
    </style>
  </head>

  <body>
    <!-- Instant splash — shows immediately before React loads -->
    <div id="splash">
      <div id="splash-logo"><img src="/icon-192.png" alt="Maniyara" /></div>
      <div id="splash-text">Maniyara</div>
      <div id="splash-sub">Loading...</div>
    </div>

    <div id="root"></div>

    <script>
      // Hide splash the moment React renders anything
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root')
        if (root && root.children.length > 0) {
          const splash = document.getElementById('splash')
          if (splash) {
            splash.classList.add('hidden')
            setTimeout(() => splash.remove(), 350)
          }
          observer.disconnect()
        }
      })
      observer.observe(document.getElementById('root'), { childList: true })

      // Fallback — remove after 3s no matter what
      setTimeout(() => {
        const splash = document.getElementById('splash')
        if (splash) { splash.classList.add('hidden'); setTimeout(() => splash.remove(), 350) }
      }, 3000)
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
